basePath: /
definitions:
  controller.LogEntry:
    properties:
      event_id:
        description: 対象のEventのID（文字列で指定）
        example: "1"
        type: string
      event_time:
        description: イベント発生日時。RFC3339形式のJST
        example: "2006-01-02T15:04:05+09:00"
        type: string
      participate_users:
        description: 参加メンバのstay_watch_idリスト（空可）
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      room_users:
        description: 在室メンバのstay_watch_idリスト（空可）
        example:
        - 3
        - 4
        items:
          type: integer
        type: array
      status_id:
        description: 対象のStatusのID
        example: 2
        type: integer
    required:
    - event_id
    - event_time
    - status_id
    type: object
  controller.RegisterLogsRequest:
    properties:
      logs:
        description: 登録するログエントリの配列（1件以上）
        items:
          $ref: '#/definitions/controller.LogEntry'
        minItems: 1
        type: array
    required:
    - logs
    type: object
  controller.RegisterStatusesRequest:
    properties:
      names:
        description: 登録するStatus名の配列（1件以上、重複不可）
        example:
        - 作業中
        - 休憩中
        items:
          type: string
        minItems: 1
        type: array
    required:
    - names
    type: object
  service.BoardActivity:
    properties:
      id:
        description: イベントID
        example: 5
        type: integer
      imageUrl:
        description: 活動の画像URL。未登録の場合は null
        example: https://example.com/daycast/events/5.png
        type: string
      members:
        description: この活動に関心があり、かつ今日来訪しそうなメンバー
        items:
          $ref: '#/definitions/service.BoardPerson'
        type: array
      minNumber:
        description: 活動の成立に必要な最低人数
        example: 3
        type: integer
      name:
        description: 活動（イベント）名
        example: 人狼
        type: string
    type: object
  service.BoardData:
    properties:
      activities:
        description: 今日メンバーが揃いそうな活動一覧
        items:
          $ref: '#/definitions/service.BoardActivity'
        type: array
      currentTime:
        description: データ生成時点の現在時刻（JST、"HH:MM"形式）
        example: "15:04"
        type: string
      hours:
        description: 現在時刻から最大4時間ぶんのタイムライン
        items:
          $ref: '#/definitions/service.BoardHour'
        type: array
      presence:
        allOf:
        - $ref: '#/definitions/service.BoardPresence'
        description: 在室情報
    type: object
  service.BoardHour:
    properties:
      hour:
        description: 時（JST、0〜23）
        example: 15
        type: integer
      people:
        description: この時間に在室していそうな人一覧
        items:
          $ref: '#/definitions/service.BoardPerson'
        type: array
    type: object
  service.BoardPerson:
    properties:
      avatarUrl:
        description: アイコン画像URL
        example: https://example.com/avatar.png
        type: string
      name:
        description: ユーザー名
        example: 山田太郎
        type: string
    type: object
  service.BoardPresence:
    properties:
      members:
        description: 在室中メンバーの配列（常に空配列）
        items:
          $ref: '#/definitions/service.BoardPresentMember'
        type: array
    type: object
  service.BoardPresentMember:
    properties:
      avatarUrl:
        description: アイコン画像URL
        example: https://example.com/avatar.png
        type: string
      name:
        description: ユーザー名
        example: 山田太郎
        type: string
    type: object
info:
  contact: {}
  description: 研究室の来訪予測・活動管理のためのAPI
  title: Stay Watch Slackbot API
  version: "1.0"
paths:
  /api/activities/probabilities:
    get:
      parameters:
      - description: '曜日 (MySQL WEEKDAY形式: 0=月, 6=日)。省略時は今日の曜日'
        in: query
        name: weekday
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 全活動の時間帯別発生確率を取得
      tags:
      - activities
  /api/board:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.BoardData'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 共有モニター用の表示データを取得
      tags:
      - board
  /api/events:
    get:
      parameters:
      - description: 取得するEventのID
        in: query
        name: id
        type: integer
      - description: 絞り込む分類（digital または analog）
        in: query
        name: game_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Event一覧を取得
      tags:
      - events
  /api/events/{id}/probability:
    get:
      parameters:
      - description: イベントID
        in: path
        name: id
        required: true
        type: integer
      - description: '曜日 (MySQL WEEKDAY形式: 0=月, 6=日)'
        in: query
        name: weekday
        required: true
        type: integer
      - description: '時刻 (HH:MM形式, JST。デフォルト: 現在時刻)'
        in: query
        name: time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: イベントの発生確率を取得
      tags:
      - events
  /api/logs:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登録するログエントリのリスト
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controller.RegisterLogsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: ログを一括登録
      tags:
      - logs
  /api/statuses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Status一覧を取得
      tags:
      - statuses
    post:
      consumes:
      - application/json
      parameters:
      - description: 登録するStatus名のリスト
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controller.RegisterStatusesRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Statusを一括登録
      tags:
      - statuses
swagger: "2.0"
